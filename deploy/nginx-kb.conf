# /etc/nginx/sites-available/kb.conf
#
# 用法：把 kb.example.com 换成你自己的域名，然后
#   sudo ln -s /etc/nginx/sites-available/kb.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 证书路径按 certbot 生成的位置写；自签证书的话改成 /etc/ssl/kb/ 下的路径。

# ---------- HTTP：一律跳 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name kb.example.com;

    # certbot 续期用这个路径，别删
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx >= 1.25.1 用下面这行；老版本改成 listen 443 ssl http2;
    http2 on;

    server_name kb.example.com;

    ssl_certificate     /etc/letsencrypt/live/kb.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kb.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---------------- 门禁 ----------------
    # 整个站点（含 /api、/docs、静态文件）都要账号密码
    auth_basic           "Personal KB";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # 导入接口一次最多 50 个文件、每个 1MB，JSON 会膨胀，留足余量
    client_max_body_size 64m;

    # 基础安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 索引重建 / 大备份恢复可能慢一点，给足时间
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # 可选：监控探活不走 Basic Auth（注意会暴露"服务在线"这一事实）
    # location = /api/health {
    #     auth_basic off;
    #     proxy_pass http://127.0.0.1:8000;
    # }
}
