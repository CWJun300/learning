# 免备案场景：IP 直连 + 非标准端口 + 自签证书
#
# 适用：服务器在中国大陆、没有域名、不想备案
# 原理：备案拦截针对的是「域名 → 80/443」的访问；直接访问 IP 的非标准端口不受影响
#
# 使用前改三处：
#   1. YOUR_SERVER_IP  → 你的公网 IP（一共 2 处：server_name 和注释）
#   2. 证书路径        → 你生成的自签证书位置
#   3. 端口 8443       → 想换别的也行，记得云安全组同步放行
#
# 然后：
#   sudo cp nginx-kb-ip.conf /etc/nginx/sites-available/kb.conf
#   sudo ln -s /etc/nginx/sites-available/kb.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 手机访问：https://YOUR_SERVER_IP:8443
#   第一次会提示"证书不受信任"，点「高级 / 继续访问」即可，之后浏览器会记住。
#   数据依然全程加密——自签证书只是"签发者不被信任"，加密强度与正式证书相同。

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;                      # nginx < 1.25.1 改成 listen 8443 ssl http2;

    server_name YOUR_SERVER_IP;

    ssl_certificate     /etc/ssl/kb/kb.crt;
    ssl_certificate_key /etc/ssl/kb/kb.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---------------- 门禁 ----------------
    auth_basic           "Personal KB";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # 导入接口一次最多 50 个文件、每个 1MB，JSON 会膨胀
    client_max_body_size 64m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
